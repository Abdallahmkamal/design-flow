# Local-only Supabase configuration. Hosted project identifiers and credentials
# must never be committed here.
project_id = "design-flow-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.email]
# The global auth.enable_signup switch keeps public registration closed.
# This provider switch must remain enabled for provisioned email/password users
# to sign in.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[functions.bootstrap_first_admin]
enabled = true
verify_jwt = false
entrypoint = "./functions/bootstrap_first_admin/index.ts"

[functions.create_member_account]
enabled = true
verify_jwt = true
entrypoint = "./functions/create_member_account/index.ts"

[functions.issue_temporary_password_reset]
enabled = true
verify_jwt = true
entrypoint = "./functions/issue_temporary_password_reset/index.ts"

[functions.deactivate_member_account]
enabled = true
verify_jwt = true
entrypoint = "./functions/deactivate_member_account/index.ts"

[functions.reactivate_member_account]
enabled = true
verify_jwt = true
entrypoint = "./functions/reactivate_member_account/index.ts"

[functions.change_own_password]
enabled = true
verify_jwt = true
entrypoint = "./functions/change_own_password/index.ts"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2
