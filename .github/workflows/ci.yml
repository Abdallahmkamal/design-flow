name: Design Flow verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-flow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use pinned Node and npm
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run static, unit, and build checks
        run: npm run verify

      - name: Run browser and accessibility checks
        run: npm run test:e2e

  local-backend:
    name: Local Supabase and Deno harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use pinned Node and npm
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use pinned Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - name: Start and reset local Supabase
        run: |
          npm run db:start
          npm run db:reset

      - name: Verify generated database types
        run: |
          npx supabase gen types typescript --local > /tmp/database.types.ts
          diff -u src/shared/supabase/database.types.ts /tmp/database.types.ts

      - name: Run pgTAP harness
        run: npm run db:test

      - name: Run Deno harness
        run: |
          npm run functions:check
          npm run functions:test

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  staging:
    name: Deploy verified staging checkpoint
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - frontend
      - local-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://design-flow-staging.pages.dev
    permissions:
      contents: read
      deployments: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.STAGING_SUPABASE_PROJECT_ID }}
      VITE_APP_ENV: staging
      VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY:
        ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_APP_URL: https://design-flow-staging.pages.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use pinned Node and npm
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link the staging database
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending staging migrations
        run: supabase db push --dry-run

      - name: Apply staging migrations
        run: supabase db push

      - name: Verify staging migration history and generated type schema
        run: |
          supabase migration list
          supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" > /tmp/database.types.ts
          node scripts/verify-hosted-database-types.mjs src/shared/supabase/database.types.ts /tmp/database.types.ts

      - name: Deploy account-lifecycle Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Build the staging frontend
        run: npm run build

      - name: Reject public source maps
        run: |
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Staging build contains source maps."
            exit 1
          fi

      - name: Deploy Cloudflare Pages staging
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command:
            pages deploy dist --project-name=design-flow-staging --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.81.0

      - name: Verify the live Phase 2 staging checkpoint
        run: npm run staging:smoke
