name: Design Flow known-good application redeploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected redeploy target
        required: true
        type: choice
        options:
          - staging
          - production
      release_sha:
        description: Known-good commit SHA already on main
        required: true
        type: string
      confirmation:
        description: Type REDEPLOY_KNOWN_GOOD
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: design-flow-redeploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  redeploy:
    name: Redeploy Functions and frontend without database mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID:
        ${{ inputs.environment == 'production' &&
        vars.PRODUCTION_SUPABASE_PROJECT_ID || vars.STAGING_SUPABASE_PROJECT_ID
        }}
      VITE_APP_ENV: ${{ inputs.environment }}
      VITE_SUPABASE_URL:
        ${{ inputs.environment == 'production' && vars.PRODUCTION_SUPABASE_URL
        || vars.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY:
        ${{ inputs.environment == 'production' &&
        vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY ||
        vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN:
        ${{ inputs.environment == 'production' && vars.PRODUCTION_SENTRY_DSN ||
        vars.STAGING_SENTRY_DSN }}
      DEPLOYMENT_APP_URL:
        ${{ inputs.environment == 'production' && vars.PRODUCTION_APP_URL ||
        'https://design-flow-staging.pages.dev' }}
      PAGES_PROJECT:
        ${{ inputs.environment == 'production' && vars.PRODUCTION_PAGES_PROJECT
        || 'design-flow-staging' }}
      EXPECTED_APP_ENV: ${{ inputs.environment }}

    steps:
      - name: Check out current automation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm exact known-good main ancestor
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$CONFIRMATION" = "REDEPLOY_KNOWN_GOOD"
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Check out known-good application
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          path: release

      - name: Preserve current security headers
        run: |
          mkdir -p release/public
          cp public/_headers release/public/_headers

      - name: Use release-pinned Node and npm
        uses: actions/setup-node@v6
        with:
          node-version-file: release/.nvmrc
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Install known-good dependencies
        working-directory: release
        run: npm ci

      - name: Use pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Redeploy known-good Edge Functions
        working-directory: release
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify backend before frontend redeploy
        run: node scripts/verify-backend.mjs

      - name: Build known-good frontend
        working-directory: release
        run: npm run build

      - name: Reject public source maps
        run: |
          if find release/dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Known-good build contains source maps."
            exit 1
          fi

      - name: Redeploy known-good Cloudflare Pages frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy release/dist --project-name=$PAGES_PROJECT
            --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.81.0

      - name: Verify known-good live release
        run: |
          npm run deployment:smoke
          echo "Known-good application $RELEASE_SHA redeployed without a database migration." >> "$GITHUB_STEP_SUMMARY"
